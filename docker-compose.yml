services:
  migrations:
    build:
      context: .
      dockerfile: cmd/migrations/Dockerfile
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DATABASE}?sslmode=disable
    networks:
      - app
    depends_on:
      db:
        condition: service_healthy
    entrypoint: [
      "goose",
      "up"
    ]

  http_server:
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DATABASE}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    networks:
      - app
    build:
      context: .
      dockerfile: cmd/http_server/Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  task_handler:
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DATABASE}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    networks:
      - app
    build:
      context: .
      dockerfile: cmd/task_handler/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  telegram_bot:
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DATABASE}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    networks:
      - app
    build:
      context: .
      dockerfile: cmd/telegram_bot/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  db:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
    networks:
      - app
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '1234:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 10s
      retries: 5
  cache:
    image: redis:latest
    container_name: redis_container
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - REDIS_DATABASES=${REDIS_DATABASE}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - app
    ports:
      - '6379:6379'
    volumes: 
      - cache:/data

volumes:
  db_data:
    driver: local
  cache:
    driver: local

networks:
  app:
    driver: bridge
